name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download and verify rsgain
        run: python tools/get_rsgain.py

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name "ReplayGain Normalizer" --collect-all customtkinter --collect-all tkinterdnd2 --add-data "rsgain;rsgain" --add-data "assets;assets" --icon "assets\icon.ico" app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ReplayGain-Normalizer-Windows
          path: dist/ReplayGain Normalizer.exe
          if-no-files-found: error
          retention-days: 14
